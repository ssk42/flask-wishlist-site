{% extends 'base.html' %}

{% block title %}Login · Wishlist App{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-emoji-smile fs-1 mb-3 d-block"></i>
                    <h1 class="h3 mb-2 fw-bold gradient-text">Welcome back</h1>
                    <p class="text-muted">Just enter your name to jump back into the wishlist.</p>
                </div>
                <form
                    action="{{ url_for('auth.login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') | urlencode }}{% endif %}"
                    method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                    <div class="mb-4">
                        <label for="name" class="form-label">Your name</label>
                        <input type="text" class="form-control form-control-lg" id="name" name="name"
                            placeholder="e.g. Gigi" required value="{{ name or '' }}" autofocus
                            aria-describedby="nameHelp">
                        <small id="nameHelp" class="form-text text-muted">The name you signed up with — capitalization doesn't matter.</small>
                    </div>
                    <div class="d-grid gap-2 mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-box-arrow-in-right me-2" viewBox="0 0 16 16"
                                style="vertical-align: text-bottom;">
                                <path fill-rule="evenodd"
                                    d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0z" />
                                <path fill-rule="evenodd"
                                    d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z" />
                            </svg>
                            Log in
                        </button>
                    </div>
                    <div class="text-center">
                        <span class="text-muted">Don't have an account?</span>
                        <a href="{{ url_for('auth.register') }}" class="text-decoration-none ms-1">Sign up</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
