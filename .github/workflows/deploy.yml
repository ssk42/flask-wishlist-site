name: Deploy to Production

# Heroku's GitHub auto-deploy is disabled — this workflow replaces it.
# Prod is gated by a GitHub Environment (production) which can require a
# designated reviewer and/or a wait timer, preventing un-reviewed deploys.
#
# To activate:
# 1. Disable Heroku's auto-deploy on main (Heroku dashboard → app → deploy)
# 2. Set HEROKU_API_KEY and HEROKU_EMAIL as repo secrets
# 3. (Optional) Create a GitHub Environment "production" with a required reviewer

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production release'
        required: true

jobs:
  deploy-prod:
    name: Deploy to Heroku
    runs-on: ubuntu-22.04
    environment: production
    concurrency: production

    steps:
      - name: Confirmation gate
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "deploy" ]]; then
            echo "❌ Input was not 'deploy' — aborting"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # heroku-deploy pushes via git; shallow clone fails

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v4
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: reitz-wishlist
          heroku_email: ${{ secrets.HEROKU_EMAIL }}

      # The Procfile release phase is disabled (see docs/LESSONS_LEARNED.md —
      # "migration mismatch"), so migrations never run automatically. Apply them
      # explicitly after the deploy lands.
      - name: Run database migrations
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          curl -sf https://cli-assets.heroku.com/install.sh | sh
          heroku run --app reitz-wishlist --exit-code flask db upgrade